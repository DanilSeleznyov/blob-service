services:
    postgres:
        image: postgres:15-alpine
        container_name: blob-postgres
        environment:
            POSTGRES_DB: ${DB_NAME:-blob_service}
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    blob-service:
        build: .
        container_name: blob-service
        ports:
            - "50051:50051"
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            DB_USER: ${DB_USER:-postgres}
            DB_PASSWORD: ${DB_PASSWORD:-postgres}
            DB_NAME: ${DB_NAME:-blob_service}
            SERVER_PORT: 50051
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

volumes:
    postgres_data:
